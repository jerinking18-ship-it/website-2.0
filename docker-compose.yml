services:
  postgres:
    image: postgres:16-alpine
    container_name: freshcart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: freshcart
      POSTGRES_USER: freshcart
      POSTGRES_PASSWORD: freshcart_dev_password
    ports:
      - "5432:5432"
    volumes:
      - freshcart_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshcart -d freshcart"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: freshcart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - freshcart_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: freshcart-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: development_key
    ports:
      - "7700:7700"
    volumes:
      - freshcart_meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  freshcart_postgres_data:
  freshcart_redis_data:
  freshcart_meilisearch_data:
